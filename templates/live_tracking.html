<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Live Tracking</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            Live Delivery 🚚

        </div>

    </div>

    <!-- LIVE PAGE -->

    <section class="live-page">

        <div class="live-container">

            <!-- LEFT -->

            <div class="live-left">

                <h1>

                    Live Order Tracking 🚀

                </h1>

                <p>

                    Real-time intelligent delivery
                    tracking powered by AI + DSA.

                </p>

                <!-- STATUS -->

                <div class="live-status">

                    <div class="status-card active">

                        ✅ Order Confirmed

                    </div>

                    <div class="status-card active">

                        📦 Packed

                    </div>

                    <div class="status-card active">

                        🚚 On The Way

                    </div>

                    <div class="status-card">

                        🏠 Delivered

                    </div>

                </div>

                <!-- ETA -->

                <div class="eta-live">

                    Estimated Arrival:
                    <span>

                        12 Minutes

                    </span>

                </div>

                <!-- DRIVER -->

                <div class="driver-live">

                    <h2>

                        Delivery Partner 👨‍✈️

                    </h2>

                    <p>

                        Arjun Kumar

                    </p>

                    <p>

                        ⭐ 4.9 Rating

                    </p>

                    <p>

                        TN 09 AB 4321

                    </p>

                </div>

                <!-- DSA BUTTON -->

                <a href="/dsa-solution" class="solution-link">

                    <button class="solution-btn">

                        🚀 View DSA Solution

                    </button>

                </a>

            </div>

            <!-- RIGHT MAP -->

            <div class="live-map">

                <div class="map-box">

                    <div class="route-line"></div>

                    <div class="point start-point">

                        🏪

                    </div>

                    <div class="delivery-bike">

                        🛵

                    </div>

                    <div class="point end-point">

                        🏠

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
