<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <h1>

            Welcome Back 🚀

        </h1>

        <p>

            Login to continue

        </p>

        <form method="POST">

            <input
            type="email"
            name="email"
            placeholder="Email"
            required
            >

            <input
            type="password"
            name="password"
            placeholder="Password"
            required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <div class="auth-link">

            New user?

            <a href="/signup">

                Signup

            </a>

        </div>

    </div>

</body>

</html>
