<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Signup</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <section class="auth-page">

        <div class="auth-card">

            <h1>

                Create Account 🚀

            </h1>

            <p>

                Join ALGO Smart Logistics

            </p>

            <form method="POST">

                <input
                type="text"
                name="username"
                placeholder="Username"
                required
                >

                <input
                type="email"
                name="email"
                placeholder="Email"
                required
                >

                <input
                type="password"
                name="password"
                placeholder="Password"
                required
                >

                <button type="submit">

                    Signup

                </button>

            </form>

            <div class="auth-link">

                Already have account?

                <a href="/login">

                    Login

                </a>

            </div>

        </div>

    </section>

</body>

</html>
