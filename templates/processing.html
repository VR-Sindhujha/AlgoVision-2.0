<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Processing Order</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;
        }

        body {

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:

            linear-gradient(
                135deg,
                #020617,
                #001845,
                #000814
            );

            overflow: hidden;

            color: white;
        }

        .processing-container {

            text-align: center;
        }

        .loader {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            border:

            8px solid rgba(255,255,255,0.1);

            border-top:

            8px solid #00d4ff;

            margin: auto;

            animation:

            spin 1s linear infinite;
        }

        h1 {

            margin-top: 40px;

            font-size: 42px;
        }

        p {

            margin-top: 20px;

            font-size: 20px;

            color: #cbd5e1;
        }

        .steps {

            margin-top: 35px;

            line-height: 2;

            color: #00ffa3;

            font-size: 18px;
        }

        @keyframes spin {

            from {

                transform: rotate(0deg);
            }

            to {

                transform: rotate(360deg);
            }
        }

    </style>

</head>

<body>

    <div class="processing-container">

        <div class="loader"></div>

        <h1>

            Processing Your Order 🚀

        </h1>

        <p>

            Optimizing delivery using DSA engines...

        </p>

        <div class="steps">

            <div>

                ✔ Heap Priority Assigned

            </div>

            <div>

                ✔ Warehouse Selected

            </div>

            <div>

                ✔ Dijkstra Route Calculated

            </div>

            <div>

                ✔ Resource Optimization Complete

            </div>

        </div>

    </div>


    <script>

        setTimeout(function() {

            window.location.href = "/dashboard";

        }, 1800);

    </script>

</body>

</html>
