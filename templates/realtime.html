<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Realtime Tracking</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>

<body>

    <section class="chatbot-page">

        <div class="chatbot-container">

            <div class="chatbot-header">

                <h1>

                    Real-Time Delivery Updates ⚡

                </h1>

                <p>

                    Live WebSocket communication system.

                </p>

            </div>


            <!-- LIVE AREA -->

            <div
            class="chat-area"
            id="liveArea"
            >

                <div class="bot-message">

                    Waiting for live updates...

                </div>

            </div>


            <!-- BUTTON -->

            <div class="chat-input">

                <button
                onclick="sendUpdate()"
                >

                    Send Live Update 🚀

                </button>

            </div>

        </div>

    </section>


<script>

const socket = io();

socket.on(

    "live_update",

    function(data) {

        let area =

        document.getElementById(

            "liveArea"
        );

        let div =

        document.createElement("div");

        div.className =

        "user-message";

        div.innerText =

        data.message;

        area.appendChild(div);
    }
);


function sendUpdate() {

    socket.emit(

        "delivery_update",

        "Package reached city hub"
    );
}

</script>

</body>

</html>
