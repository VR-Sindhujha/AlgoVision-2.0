<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            Wishlist ❤️

        </div>

    </div>


    <!-- WISHLIST SECTION -->

    <section class="cart-page">

        <div class="cart-container">

            <h1>

                My Wishlist ❤️

            </h1>

            {% if wishlist_items %}

                {% for item in wishlist_items %}

                <div class="cart-card">

                    <img
                    src="{{ url_for('static', filename='images/' + item.image) }}"
                    >

                    <div class="cart-info">

                        <h2>

                            {{ item.name }}

                        </h2>

                        <p>

                            ₹{{ item.price }}

                        </p>

                    </div>

                    <a
                    href="/remove-from-wishlist/{{ item.id }}"
                    >

                        <button>

                            Remove

                        </button>

                    </a>

                </div>

                {% endfor %}

            {% else %}

                <div class="empty-cart">

                    Wishlist is empty 💔

                </div>

            {% endif %}

        </div>

    </section>

</body>

</html>
